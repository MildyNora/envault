[package]
name = "envault"
version = "0.5.2"
edition = "2021"
description = "Local secrets vault for agentic coding: agents see aliases and ciphers, never plaintext"
license = "MIT"

[dependencies]
age = { version = "0.11", features = ["armor"] }
anyhow = "1"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
dotenvy = "0.15"
portable-pty = "0.8"
ratatui = "0.29"
robius-authentication = "0.3.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }
url = "2"
urlencoding = "2"

# Secret store backend, per platform: Keychain (macOS), Credential Manager
# (Windows), Secret Service (Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tungstenite = "0.24"
